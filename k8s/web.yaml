apiVersion: apps/v1
kind: Deployment
metadata:
  name: crud-php
  namespace: crud-mysql
spec:
  replicas: 1
  selector:
    matchLabels:
      app: crud-php
  template:
    metadata:
      labels:
        app: crud-php
    spec:
      nodeSelector:
        kubernetes.io/hostname: node1
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: crud-php
          image: quay.io/mmandam0/crud-php:1.0
          imagePullPolicy: Always
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            capabilities:
              drop:
                - ALL
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: DB_HOST
              value: mysql
            - name: MYSQL_DATABASE
              valueFrom:
                secretKeyRef:
                  name: crud-mysql-credentials
                  key: MYSQL_DATABASE
            - name: MYSQL_USER
              valueFrom:
                secretKeyRef:
                  name: crud-mysql-credentials
                  key: MYSQL_USER
            - name: MYSQL_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: crud-mysql-credentials
                  key: MYSQL_PASSWORD
          startupProbe:
            tcpSocket:
              port: http
            failureThreshold: 30
            periodSeconds: 5
          readinessProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 12
          livenessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 30
            periodSeconds: 20
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
---
apiVersion: v1
kind: Service
metadata:
  name: crud-php
  namespace: crud-mysql
spec:
  selector:
    app: crud-php
  ports:
    - name: http
      port: 8080
      targetPort: http
---
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: crud-php
  namespace: crud-mysql
spec:
  to:
    kind: Service
    name: crud-php
  port:
    targetPort: http
  tls:
    termination: edge
    insecureEdgeTerminationPolicy: Redirect
